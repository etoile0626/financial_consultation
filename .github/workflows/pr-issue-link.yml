name: PR Issue Link

# 1) link:     PR 생성 시 제목/본문에 이슈 번호가 없으면 이슈를 자동 생성해 연결한다.
# 2) validate: PR 제목·본문이 컨벤션(`[Prefix] 요약 (#번호)`, `Closes #번호`)을 지키는지 검사한다.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [dev, main]

permissions:
  contents: read
  issues: write
  pull-requests: write

# 같은 PR에 대한 실행이 겹쳐 이슈가 중복 생성되지 않도록 직렬화
concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  link:
    # 최초 생성 시 한 번만 이슈를 만든다 (edited 등에서 중복 생성 방지)
    if: github.event.action == 'opened' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 이슈 번호 확인 및 자동 연결
        run: |
          # 제목/본문은 스크립트에 직접 삽입하지 않고 API로 조회한다 (인젝션 방지)
          title=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq .title)
          body=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body)

          title_num=$(printf '%s' "$title" | grep -oE '\(#[0-9]+\)[[:space:]]*$' | grep -oE '[0-9]+' || true)
          body_num=$(printf '%s' "$body" | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' | head -1 | grep -oE '[0-9]+$' || true)

          num="${title_num:-$body_num}"

          if [ -z "$num" ]; then
            issue_body="PR #${PR_NUMBER}에서 자동 생성된 이슈입니다. 상세 내용은 PR을 참고하세요."
            url=$(gh issue create --repo "$REPO" --title "$title" --body "$issue_body")
            num="${url##*/}"
            echo "이슈 #$num 생성"
          else
            echo "기존 이슈 #$num 사용"
          fi

          new_title="$title"
          new_body="$body"
          [ -z "$title_num" ] && new_title="$title (#$num)"
          [ -z "$body_num" ] && new_body="$body"$'\n\n'"Closes #$num"

          if [ "$new_title" != "$title" ] || [ "$new_body" != "$body" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --title "$new_title" --body "$new_body"
          fi

  validate:
    needs: link
    # link가 건너뛰어져도(edited 등) 검증은 항상 실행
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR 제목·본문 검증
        run: |
          # link가 제목/본문을 수정했을 수 있으므로 이벤트 페이로드가 아닌 최신 값을 조회한다
          title=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq .title)
          body=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body)

          fail() { echo "::error::$1"; exit 1; }

          printf '%s' "$title" | grep -qE '^\[(Feat|Fix|Refactor|Test|Docs|Chore)\] .+ \(#[0-9]+\)$' \
            || fail "PR 제목은 '[Feat|Fix|Refactor|Test|Docs|Chore] 요약 (#이슈번호)' 형식이어야 합니다. 현재: $title"

          title_num=$(printf '%s' "$title" | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+')

          printf '%s' "$body" | grep -iqE "(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#${title_num}([^0-9]|$)" \
            || fail "PR 본문에 'Closes #${title_num}' (또는 Fixes)가 필요합니다."

          is_pr=$(gh api "repos/$REPO/issues/$title_num" --jq '.pull_request != null' 2>/dev/null) \
            || fail "이슈 #${title_num}를 찾을 수 없습니다."
          [ "$is_pr" = "false" ] || fail "#${title_num}은 이슈가 아니라 PR입니다."

          echo "OK: 이슈 #${title_num} 연결 확인"
