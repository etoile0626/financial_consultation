name: Close Linked Issue

# GitHub의 자동 닫힘은 기본 브랜치(main)로 머지될 때만 동작한다.
# 이 프로젝트는 feature PR을 dev로 머지하므로, dev 머지 시 연결된 이슈를 직접 닫는다.
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-issue:
    # 닫힌 PR 중 '머지된' 경우에만 실행
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: 연결된 이슈 닫기
        run: |
          body=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body)

          nums=$(printf '%s' "$body" \
            | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -u || true)

          if [ -z "$nums" ]; then
            echo "연결된 이슈가 없어 건너뜁니다."
            exit 0
          fi

          for n in $nums; do
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq .state 2>/dev/null || echo "")
            if [ "$state" = "OPEN" ]; then
              gh issue close "$n" --repo "$REPO" --reason completed \
                --comment "PR #${PR_NUMBER}이 dev에 머지되어 이슈를 닫습니다."
              echo "이슈 #$n 닫음"
            else
              echo "이슈 #$n 는 닫을 대상이 아닙니다 (state=${state:-없음})."
            fi
          done
