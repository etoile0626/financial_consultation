name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# 같은 브랜치에서 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 테스트가 pgvector DB를 사용하므로 로컬 docker-compose와 같은 이미지를 띄운다.
    # 아래 값은 이 실행 동안만 존재하는 일회용 테스트 DB 정보이며 실제 시크릿이 아니다.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fc_test
          POSTGRES_USER: fc_test
          POSTGRES_PASSWORD: fc_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fc_test -d fc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: fc_test
      DB_USERNAME: fc_test
      DB_PASSWORD: fc_test_pw

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # 서비스 컨테이너는 init 디렉터리를 마운트할 수 없어 스키마를 직접 적용한다.
      - name: DB 스키마 적용
        run: |
          for f in docker/postgres/init/*.sql; do
            echo "apply $f"
            PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
