services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fc-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 최초 볼륨 생성 시에만 실행됨 (확장 생성 등)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  embedding-server:
    build: ./embedding-server
    container_name: fc-embedding-server
    ports:
      - "${EMBEDDING_SERVER_PORT:-8000}:8000"
    environment:
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
    restart: unless-stopped

volumes:
  postgres-data:
